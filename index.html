
<!DOCTYPE html>

================================ -->


<section class="hero">



<div class="hero-background">


<img 
src="assets/images/hero/hero-01.webp"
class="hero-image active"
>


<img 
src="assets/images/hero/hero-02.webp"
class="hero-image"
>


<img 
src="assets/images/hero/hero-03.webp"
class="hero-image"
>


<img 
src="assets/images/hero/hero-04.webp"

>


<img 
src="assets/images/hero/hero-05.webp"
class="hero-image"
>


<img 
src="assets/images/hero/hero-06.webp"
class="hero-image"
>


<img 
src="assets/images/hero/hero-07.webp"
class="hero-image"
>

<div class="hero-overlay"></div>






<div class="hero-content">



<div class="glass-tag">

Modern Steakhouse

</div>




<h1>


<span>
Where fire
</span>


<span class="gold-text">
meets perfection
</span>



</h1>





<p>

Premium cuts, handcrafted dishes,
and culinary experiences built around
ancient fire techniques.

</p>





<div class="hero-actions">


<a class="glass-button primary">

Explore Menu

</a>


<a class="glass-button">

Reserve Table

</a>

<div class="hero-product">


<img 
src="assets/images/hero/steak.png"

01 / 07

================================ -->

</div>

<img src="assets/images/dishes/kebab/main.webp">

</div>

</div>



<div class="marquee-item">

</div>



<div class="marquee-item">

</div>



</div>



</section>

================================ -->

Signature Collection
</span>

Our Menu
</h2>


</div>





<div class="menu-carousel" id="menuCarousel">

<!-- Javascript generates cards here -->

</div>




</section>

================================ -->


<div class="dish-modal">



<div class="modal-glass">


<button class="modal-close">

×


</button>




<img 
class="modal-main-image"
>




<div class="modal-info">


<h2 class="modal-title">

</h2>

</p>

Ingredients

</ul>

</div>



</div>



</div>
